<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retraites | Centre de Yoga Santosha</title>
    <meta name="description" content="Retraites et stages de yoga avec Julie Van Brabant en Italie, Espagne et Belgique.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/santosha-logo.png">

<body>

    <div class="page-wrapper">

        <div class="page-hero" id="retreat-hero"
            style="background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), linear-gradient(135deg, #8a6f5a, #5c4a3c);">
            <div class="container">
                <span class="hero-tag" style="color: white; opacity: 0.9;">☽ Ressourcement</span>
                <h1 style="color: white;">Retraites de yoga</h1>
                <div class="divider divider-center" style="background: white;"></div>
            </div>
        </div>

        <section>
            <div class="container">

                <!-- Tabs -->
                <div class="schedule-tabs">
                </div>

                <!-- ITALIE -->
                <div id="tab-italie" class="tab-content active">


                    <div class="two-col">
                        <div class="retreat-main">


                            





                        </div>


                    </div>
                </div>

            </div>
        </section>

        <!-- Formulaire déjà présent dans la carte ci-dessus -->

    </div><!-- .page-wrapper -->

    <!-- Lightbox galerie -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Galerie photos" aria-hidden="true">
        <button type="button" class="lightbox-close" aria-label="Fermer">&times;</button>
        <button type="button" class="lightbox-nav lightbox-prev" aria-label="Photo précédente">&#8249;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
        <button type="button" class="lightbox-nav lightbox-next" aria-label="Photo suivante">&#8250;</button>
    </div>

    <script src="js/components.js"></script>
    <script>
        // Bannière dédiée par onglet
        const HEROES = {
            
        };

        const hero = document.getElementById('retreat-hero');
        const heroSub = document.getElementById('retreat-hero-sub');

        function setHero(tabName) {
            const data = HEROES[tabName];
            if (!data || !hero) return;
            hero.style.backgroundImage =
                `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${data.img}')`;
            if (heroSub) heroSub.textContent = data.sub;
        }

        function activateTab(tabName) {
            const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            const content = document.getElementById('tab-' + tabName);
            if (!btn || !content) return;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            content.classList.add('active');
            setHero(tabName);
        }

        function activateTabFromHash() {
            const hash = window.location.hash.substring(1);
            if (hash && document.querySelector(`.tab-btn[data-tab="${hash}"]`)) {
                activateTab(hash);
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activateTab(btn.dataset.tab);
                if (window.location.hash !== '#' + btn.dataset.tab) {
                    history.replaceState(null, '', '#' + btn.dataset.tab);
                }
            });
        });

        window.addEventListener('hashchange', activateTabFromHash);
        activateTabFromHash();

        // Précharge les images de bannière pour un changement instantané
        Object.values(HEROES).forEach(({ img }) => { new Image().src = img; });

        // ---- Lightbox galerie ----
        (function initLightbox() {
            const items = Array.from(document.querySelectorAll('.gallery-item'));
            const box = document.getElementById('lightbox');
            if (!items.length || !box) return;

            const imgEl = document.getElementById('lightbox-img');
            const btnClose = box.querySelector('.lightbox-close');
            const btnPrev = box.querySelector('.lightbox-prev');
            const btnNext = box.querySelector('.lightbox-next');
            let index = 0;
            let lastFocus = null;

            function show(i) {
                index = (i + items.length) % items.length;
                const item = items[index];
                const thumb = item.querySelector('img');
                imgEl.src = item.dataset.full;
                imgEl.alt = thumb ? thumb.alt : '';
            }

            function open(i) {
                lastFocus = document.activeElement;
                show(i);
                box.classList.add('open');
                box.setAttribute('aria-hidden', 'false');
                document.body.classList.add('lightbox-open');
                btnClose.focus();
            }

            function close() {
                box.classList.remove('open');
                box.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('lightbox-open');
                if (lastFocus) lastFocus.focus();
            }

            items.forEach((item, i) => {
                item.addEventListener('click', () => open(i));
            });

            btnClose.addEventListener('click', close);
            btnPrev.addEventListener('click', () => show(index - 1));
            btnNext.addEventListener('click', () => show(index + 1));

            box.addEventListener('click', (e) => {
                if (e.target === box) close();
            });

            document.addEventListener('keydown', (e) => {
                if (!box.classList.contains('open')) return;
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowLeft') show(index - 1);
                else if (e.key === 'ArrowRight') show(index + 1);
            });
        })();
    </script>
</body>

</html>
